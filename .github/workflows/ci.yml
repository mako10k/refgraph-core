name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run
      - name: Package smoke test
        run: |
          PACKAGE=$(npm pack --silent)
          mkdir smoke
          cd smoke
          npm init -y >/dev/null
          npm install "../$PACKAGE" >/dev/null
          node --input-type=module -e "
            import { mkdtemp, rm } from 'node:fs/promises';
            import { tmpdir } from 'node:os';
            import { join } from 'node:path';
            import { LocalRepository, RefGraph } from '@mako10k/refgraph-core';
            if (!RefGraph || !LocalRepository) process.exit(1);
            const parent = await mkdtemp(join(tmpdir(), 'refgraph-core-smoke-'));
            try {
              const repository = await LocalRepository.create(join(parent, 'repository'));
              const cid = await repository.putRaw(new Uint8Array([1]));
              await repository.addRoot(cid);
              await repository.close();
            } finally {
              await rm(parent, { recursive: true, force: true });
            }
          "
